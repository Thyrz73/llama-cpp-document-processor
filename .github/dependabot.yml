version: 2
updates:
  # Regenerates the pip-compile locks from requirements*.in.
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
