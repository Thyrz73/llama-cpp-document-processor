name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Check Python formatting
        run: ruff format --check .
      - name: Lint Python
        run: ruff check .
      - name: Type-check Python
        run: mypy
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate Python syntax
        run: python -m compileall -q app.py document_processor scripts tests
      - name: Check benchmark dry run
        run: python scripts/benchmark.py --variants docs/benchmark-variants.example.json --repeat 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run browser polling tests
        run: node --test tests/test_polling.js
      - name: Validate frontend syntax and Compose
        run: |
          for file in static/js/*.js static/report.js tests/test_polling.js tests/helpers/*.js; do node --check "$file"; done
          docker compose config --quiet
      - name: Check application packaging
        run: docker build -t document-processor:test .
